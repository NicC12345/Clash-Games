<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Games</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            font-size: 18px;
            line-height: 1.6;
        }

        header {
            background-color: rgba(0, 111, 6, 0.9);
            color: white;
            padding: 20px;
        }

        header img {
            width: 50px;
            display: inline-block;
            vertical-align: middle;
        }

        header h1 {
            display: inline-block;
            margin-left: 20px;
            vertical-align: middle;
            color: white;
            font-size: 32px;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffcc00;
        }

        section {
            margin: 50px 0;
            background-color: #B3FFB3; /* Light green */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        footer {
            margin-top: 50px;
            padding: 30px;
            background-color: #333;
            color: white;
            font-size: 16px;
        }

        footer p {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <header>
        <img src="images/Logo.png" alt="Clash Games Logo" width="300">
        <h1>Clash Games</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="games.html">Games</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section>
        <h2>Welcome to Clash Games</h2>
        <p>We strive to make great games, not meh ones</p>
        <img src="images/GameIMG.png" alt="Clash Games Logo" width="1600">
        <img src="images/scale.png" alt="Clash Games Logo" width="300">
        <img src="images/wisp.png" alt="Clash Games Logo" width="300">
        <img src="images/desktop.png" alt="Clash Games Logo" width="300">
        <h2></h2>
        <button onclick="goToPage('games.html')">View Games</button>
        <button onclick="goToPage('about.html')">About Us</button>
        <button onclick="goToPage('contact.html')">Contact Us</button>
    </section>

    <footer>
        <p>&copy; 2024 Clash Games. All Rights Reserved.</p>
    </footer>

    <script>
        function goToPage(page) {
            window.location.href = page;
        }
    </script>

</body>
</html>
